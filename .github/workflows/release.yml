name: release

on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.18.2
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/*"
      # main is protected by a ruleset that requires pull requests and signed
      # commits. GoReleaser's API commits are unsigned, so the generated cask
      # and Scoop manifest are committed here through GitHub's
      # createCommitOnBranch mutation, which produces a verified signature,
      # and merged as a pull request.
      - name: Publish release manifests
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          tag="$GITHUB_REF_NAME"
          cask="dist/homebrew/Casks/driveignore.rb"
          scoop="dist/scoop/bucket/driveignore.json"
          for file in "$cask" "$scoop"; do
            [ -f "$file" ] || { echo "missing generated manifest: $file" >&2; exit 1; }
          done

          # Homebrew 7 renamed `postflight` to `postflight_steps`, whose DSL has
          # no staged_path; the command must run from the staged directory.
          python3 - <<'PY'
          import pathlib, re, sys

          path = pathlib.Path("dist/homebrew/Casks/driveignore.rb")
          source = path.read_text()
          block = """  postflight_steps do
              if OS.mac?
                run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "driveignore"], chdir: "."
              end
          end"""
          fixed, count = re.subn(r"  postflight(_steps)? do\n.*?\n  end", block, source, flags=re.S)
          if count != 1:
              print(f"expected one postflight block, rewrote {count}", file=sys.stderr)
              sys.exit(1)
          path.write_text(fixed)
          PY

          main_sha=$(gh api "repos/$repo/commits/main" --jq .sha)

          up_to_date=1
          for pair in "Casks/driveignore.rb:$cask" "bucket/driveignore.json:$scoop"; do
            path="${pair%%:*}"
            file="${pair#*:}"
            remote=$(gh api "repos/$repo/contents/$path?ref=main" --jq .content 2>/dev/null | tr -d '\n' || true)
            local=$(base64 < "$file" | tr -d '\n')
            [ "$remote" = "$local" ] || up_to_date=0
          done
          if [ "$up_to_date" = 1 ]; then
            echo "manifests already up to date on main"
            exit 0
          fi

          branch="goreleaser/manifests-$tag"
          gh api -X POST "repos/$repo/git/refs" -f ref="refs/heads/$branch" -f sha="$main_sha" >/dev/null

          cask_b64=$(base64 < "$cask" | tr -d '\n')
          scoop_b64=$(base64 < "$scoop" | tr -d '\n')
          payload=$(mktemp)
          cat > "$payload" <<JSON
          {"query":"mutation(\$input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: \$input) { commit { oid } } }","variables":{"input":{"branch":{"repositoryNameWithOwner":"$repo","branchName":"$branch"},"message":{"headline":"chore(release): update Homebrew cask and Scoop manifest for $tag"},"expectedHeadOid":"$main_sha","fileChanges":{"additions":[{"path":"Casks/driveignore.rb","contents":"$cask_b64"},{"path":"bucket/driveignore.json","contents":"$scoop_b64"}]}}}}
          JSON
          result=$(gh api graphql --input "$payload")
          if [ -z "$(echo "$result" | jq -r '.data.createCommitOnBranch.commit.oid // empty')" ]; then
            echo "$result" >&2
            exit 1
          fi

          gh pr create --repo "$repo" --base main --head "$branch" \
            --title "chore(release): update Homebrew cask and Scoop manifest for $tag" \
            --body "Automated manifest update for $tag. The commit is created through the GitHub API so it carries a verified signature, and is merged through this pull request to satisfy the main ruleset."
          for _ in $(seq 1 12); do
            if gh pr merge "$branch" --repo "$repo" --merge --delete-branch; then
              exit 0
            fi
            sleep 5
          done
          echo "failed to merge manifest PR for $branch" >&2
          exit 1
