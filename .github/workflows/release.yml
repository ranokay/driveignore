name: release

on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.18.2
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/*"
      # main is protected by a ruleset: direct pushes are rejected, so
      # GoReleaser opens pull requests for the cask and Scoop manifest and we
      # merge them here. GitHub's merge commit satisfies the signature rule.
      - name: Merge manifest pull requests
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          merge_pr() {
            branch="$1"
            for _ in $(seq 1 12); do
              number=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$branch" --state open --json number --jq '.[0].number')
              if [ -n "$number" ]; then
                gh pr merge "$number" --repo "$GITHUB_REPOSITORY" --merge && return 0
              fi
              sleep 5
            done
            echo "no mergeable manifest PR found for $branch" >&2
            return 1
          }
          merge_pr "goreleaser/homebrew-${GITHUB_REF_NAME}"
          merge_pr "goreleaser/scoop-${GITHUB_REF_NAME}"
