name: ci
on: [push, pull_request]
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Set up Go
        uses: actions/setup-go@0caeaed6fd66a828038c2da3c0f662a42862658f # v1.1.3
        with:
          go-version: 1.25
        id: go

      - name: Check out code into the Go module directory
        uses: actions/checkout@50fbc622fc4ef5163becd7fab6573eac35f8462e # v1.2.0

      - name: Build Windows
        run: GOOS=windows GOARCH=386 go build -o driveignore.exe -v .

      - name: Build OSX
        if: startsWith(github.ref, 'refs/tags/') && github.repository == 'shilangyu/driveignore'
        continue-on-error: true
        run: GOOS=darwin GOARCH=amd64 go build -o driveignore.dmg -v .

      - name: Test
        run: go test ./...

      - name: Release
        uses: softprops/action-gh-release@da05d552573ad5aba039eaac05058a918a7bf631 # v2.2.2
        if: startsWith(github.ref, 'refs/tags/') && github.repository == 'shilangyu/driveignore'
        with:
          files: |
            driveignore.exe
            driveignore.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
