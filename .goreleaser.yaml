version: 2

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: driveignore
    main: .
    binary: driveignore
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/ranokay/driveignore/internal/version.version={{.Version}}
      - -X github.com/ranokay/driveignore/internal/version.commit={{.Commit}}
      - -X github.com/ranokay/driveignore/internal/version.date={{.Date}}
    goos:
      - windows
      - darwin
      - linux
    goarch:
      - amd64
      - arm64

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

changelog:
  use: github
  groups:
    - title: Features
      regexp: '^.*?feat(\([^)]+\))??!?:.+$'
      order: 0
    - title: Fixes
      regexp: '^.*?fix(\([^)]+\))??!?:.+$'
      order: 1
    - title: Other changes
      order: 999

release:
  prerelease: auto
